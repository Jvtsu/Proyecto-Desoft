[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsarlab"
version = "0.1.0"
description = "Local Streamlit workbench for pulsar timing, glitch analysis, phase derivatives, and publication figures."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Agustin Buruchaga"}
]
dependencies = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0"
]

[project.scripts]
plab = "plab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "core*",
    "plotting*",
    "exports*",
    "plab*"
]

[tool.setuptools]
include-package-data = true
